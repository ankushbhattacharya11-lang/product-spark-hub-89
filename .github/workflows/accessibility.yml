name: Accessibility audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  axe:
    name: axe-core + keyboard audit (light & dark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          bun run dev &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "dev server never became ready" >&2
          exit 1

      - name: Run accessibility audit
        run: python3 scripts/a11y-audit.py

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: .a11y-reports/axe-report.json
          if-no-files-found: warn
